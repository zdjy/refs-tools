server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /certs/local.crt;
    ssl_certificate_key /certs/local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 认证请求、Cookie 和查询串不写入本地代理访问日志。
    access_log off;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    # 管理端与裁判端同源，才能共用 Host/Origin 校验与 HttpOnly Cookie 会话。
    # 管理端构建 base 为 /admin/，其资源与路由回退均限定在该前缀内。
    # 容器内监听 443，宿主映射为其他端口；关闭绝对重定向，避免 Location 丢失宿主端口。
    absolute_redirect off;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
